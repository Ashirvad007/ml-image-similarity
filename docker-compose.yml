services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ml-image-backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ml-image-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules

    restart: unless-stopped